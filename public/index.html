<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extremis DataSentry | AI Tabular Data Quality & ML Reliability</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◈</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.55.0/build/stlite.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d1117;
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Space Grotesk', sans-serif, system-ui;
      background: #0d1117;
      color: #f0f6fc;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid #3fb950;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 1s linear infinite;
      margin-bottom: 1.5rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <h2 style="margin:0 0 0.5rem 0; font-weight:700;">◈ Extremis DataSentry</h2>
    <p style="color:#8b949e; margin:0;">Initializing WebAssembly Python environment on Vercel...</p>
  </div>
  <div id="root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.55.0/build/stlite.js"></script>
  <script>
    stlite.mount({
      requirements: ["pandas", "numpy", "scikit-learn", "scipy", "plotly"],
      entrypoint: "app.py",
      files: {
        "app.py": {
          url: "https://raw.githubusercontent.com/placeholder/app.py"
        }
      }
    }, document.getElementById("root")).then(() => {
      document.getElementById("loading").style.display = "none";
    });
  </script>
</body>
</html>
